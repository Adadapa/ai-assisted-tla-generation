CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3
    s4 = s4
    v1 = v1
    v2 = v2
    Nil = Nil
    Genesis = Genesis
    MsgPrePrepare = MsgPrePrepare
    MsgPrepare = MsgPrepare
    MsgCommit = MsgCommit
    MsgViewChange = MsgViewChange
    MsgViewData = MsgViewData
    MsgNewView = MsgNewView
    MsgStateTransferRequest = MsgStateTransferRequest
    MsgStateTransferResponse = MsgStateTransferResponse
    PhaseCommitted = PhaseCommitted
    PhaseProposed = PhaseProposed
    PhasePrepared = PhasePrepared
    PhaseAbort = PhaseAbort
    WalProposed = WalProposed
    WalCommit = WalCommit
    WalViewChange = WalViewChange
    WalNewView = WalNewView

INVARIANT
    Validity

CONSTANT
    Server = {s1, s2, s3, s4}
    Values = {v1, v2}
    MaxSeq = 3
    MaxView = 3
    MaxWalLen = 4
    MaxDecisionsPerLeader = 2
    Quorum = 3
    MaxClientProposalLimit = 2
    MaxSyncLimit = 2
    MaxViewChangeLimit = 2
    MaxViewDataLimit = 4
    MaxCrashLimit = 1
    MaxLoseLimit = 2
    MaxMsgBufferLimit = 8

INIT MCInit
NEXT MCNext

INVARIANTS
    MCTypeOK
    MessageBufferBound
    Agreement
    NoDuplicateDelivery
    MonotonicCheckpoint

\* Extension invariants are enabled in targeted hunt cfgs:
\*    LeaderMetadataAgreement
\*    InFlightSelectionSafety
\*    RestorePhaseSoundness
