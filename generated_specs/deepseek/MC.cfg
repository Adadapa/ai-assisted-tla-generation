SPECIFICATION MCSpec

CONSTANTS
    Server             = {1, 2, 3, 4}
    F                  = 1
    Quorum             = 3
    Byzantine          = {}
    NodesList          <- MCNodesList
    DecisionsPerLeader = 2
    LeaderRotation     = FALSE
    MaxView            = 3
    MaxSeq             = 2
    NULL               = 0
    MaxCrashes         = 2
    MaxByzMsgs         = 0
    MaxVCDrops         = 2
    MaxViewChanges     = 3
    MaxInformDrops     = 0

CONSTRAINT MsgBufConstraint

INVARIANTS
    \* ── Structural (always enabled) ─────────────────────────────────────────
    MCTypeOK
    LogMonotonic
    \* ── Standard safety (always enabled) ───────────────────────────────────
    Agreement
    ViewChangeSafety
    NoViewFork
    \* ── Extension invariants (bug-family targets) ───────────────────────────
    \* These are commented out in the standard config; enable in hunt configs.
    \* NoFalseTimeout               \* Family 1: spurious HBM timeout
    \* LeaderIdentityConsistency     \* Family 3: non-atomic two-lock update
    \* DeliverImpliesViewEntered     \* Family 2: deliver-before-validate
    \* InFlightReplay                \* Family 5: committedDuringViewChange stale
    \* InformViewNotDropped          \* Family 4: informChan buffer-1 drop
